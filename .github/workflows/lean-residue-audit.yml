name: Lean Residue Audit

on:
  push:
    branches: ["agent/code-mode-runtime-v2"]
    paths:
      - "scripts/lean-residue-cleanup.mjs"
      - ".github/workflows/lean-residue-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-mode-runtime-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply final residue cleanup
        run: node scripts/lean-residue-cleanup.mjs
      - name: Reject strong Full Fabric implementation residue
        shell: bash
        run: |
          set -euo pipefail
          pattern='actorId|actorName|byActor|ownerHostId|ownerIdentityId|meshRoot|sessionSeed|thinkingTransfer|handoffCompact|deferHandoff|actorRunArchive|ParticipantGuidance|RLM_BUDGET|RLM_COST|rlm_cost|Prewalk trajectory|Deferred handoff'
          if grep -RInE "$pattern" src tests; then
            echo "Strong Full Fabric implementation residue remains" >&2
            exit 1
          fi
      - name: Validate
        run: pnpm check
      - name: Remove audit scaffolding and commit
        run: |
          rm -f scripts/lean-residue-cleanup.mjs .github/workflows/lean-residue-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: remove final Lean telemetry and naming residue"
          git push origin HEAD:agent/code-mode-runtime-v2
