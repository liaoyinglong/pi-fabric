name: Lean profile migration

on:
  push:
    branches: [agent/code-mode-runtime-v2]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-mode-runtime-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate Lean public contracts
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing migration anchor in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "src/ui/lean-exec-render.ts",
              '''  audit.ref ?? [audit.provider, audit.tool].filter(Boolean).join(".") || "tool";\n''',
              '''  (audit.ref ?? [audit.provider, audit.tool].filter(Boolean).join(".")) || "tool";\n''',
          )
          replace(
              "src/runtime/guest-types.ts",
              '''interface FabricAgentRequest {\n  task: string;\n  name?: string;\n  runner?: FabricAgentRunner;\n  transport?: FabricTransport;\n  model?: string;\n  persona?: string;\n  thinking?: FabricThinking;\n  tools?: string[];\n  timeoutMs?: number;\n  extensions?: boolean;\n  recursive?: boolean;\n  worktree?: boolean;\n  schema?: Record<string, unknown>;\n}\n''',
              '''interface FabricAgentRequest {\n  task: string;\n  profile?: string;\n  name?: string;\n  timeoutMs?: number;\n  worktree?: boolean;\n  schema?: Record<string, unknown>;\n}\n''',
          )
          replace(
              "src/runtime/guest-types.ts",
              '''interface FabricSubagentRoleCatalog {\n  roles: FabricSubagentRoleInfo[];\n  sources: string[];\n}\n''',
              '''interface FabricSubagentProfileCatalog {\n  profiles: FabricSubagentRoleInfo[];\n  sources: string[];\n}\n''',
          )
          replace(
              "src/runtime/guest-types.ts",
              '''  list(args?: Record<string, never>): Promise<Array<FabricAgentResult | FabricAgentHandle>>;\n  roles(args?: Record<string, never>): Promise<FabricSubagentRoleCatalog>;\n  models(args?: { runner?: FabricAgentRunner; refresh?: boolean }): Promise<FabricModelInfo[]>;\n''',
              '''  list(args?: Record<string, never>): Promise<Array<FabricAgentResult | FabricAgentHandle>>;\n  profiles(args?: Record<string, never>): Promise<FabricSubagentProfileCatalog>;\n  recurse(args: FabricAgentRequest & { profile: string }): Promise<{\n    id: string;\n    name: string;\n    status: FabricAgentResult["status"];\n    text: string;\n    value?: unknown;\n    error?: string;\n    turns: number;\n    toolCalls: number;\n    usage: FabricAgentUsage;\n  }>;\n''',
          )
          replace(
              "src/execution-service.ts",
              '''      if (ref !== "agents.run" && ref !== "agents.spawn") return;\n''',
              '''      if (ref !== "agents.run" && ref !== "agents.spawn" && ref !== "agents.recurse") return;\n''',
          )
      - run: pnpm check
      - name: Commit verified migration
        run: |
          rm .github/workflows/lean-profile-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: expose profile-based subagent contract"
          git push origin HEAD:agent/code-mode-runtime-v2
