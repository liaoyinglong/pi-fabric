name: Fix Lean runtime contracts

on:
  push:
    branches: [agent/code-mode-runtime-v2]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: rerun runtime contract migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-mode-runtime-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch contracts
        run: node scripts/fix-lean-runtime-contracts.mjs
      - name: Verify
        run: pnpm check
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-lean-runtime-contracts.yml scripts/fix-lean-runtime-contracts.mjs
          git add src tests skills
          git commit -m "fix: enforce Lean tool and Veda prompt contracts"
          git push origin HEAD:agent/code-mode-runtime-v2
