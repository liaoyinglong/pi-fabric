name: Lean Physical Cleanup

on:
  push:
    branches: ["agent/code-mode-runtime-v2"]
    paths:
      - "scripts/finalize-lean-docs.mjs"
      - ".github/workflows/lean-physical-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-mode-runtime-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Synchronize docs and remove temporary cleanup scaffolding
        run: |
          node scripts/finalize-lean-docs.mjs
          rm -f \
            scripts/lean-physical-cleanup.mjs \
            scripts/lean-test-contract-cleanup.mjs \
            scripts/lean-agent-substrate-cleanup.mjs \
            scripts/fix-lean-agent-cleanup.mjs \
            scripts/finalize-lean-docs.mjs \
            .github/workflows/lean-physical-cleanup.yml
      - name: Validate
        run: pnpm check
      - name: Commit final cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: finalize physical Lean V2 boundary"
          git push origin HEAD:agent/code-mode-runtime-v2
