name: Lean Physical Cleanup

on:
  push:
    branches: ["agent/code-mode-runtime-v2"]
    paths:
      - "scripts/lean-agent-substrate-cleanup.mjs"
      - "scripts/fix-lean-agent-cleanup.mjs"
      - ".github/workflows/lean-physical-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-mode-runtime-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Apply physical cleanup
        run: |
          node scripts/fix-lean-agent-cleanup.mjs
          node scripts/lean-agent-substrate-cleanup.mjs
      - name: Validate
        run: pnpm check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests docs package.json scripts
          git commit -m "refactor: remove actor mesh and trajectory compatibility"
          git push origin HEAD:agent/code-mode-runtime-v2
